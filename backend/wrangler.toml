# ============================================================================
# Cloudflare Worker configuration — AI Trading Assistant API
# ----------------------------------------------------------------------------
# Phase 2 — Secure Backend Foundation
#
# IMPORTANT:
#   • This file must NEVER contain real secrets or API keys.
#   • Future secrets (MARKET_DATA_API_KEY, NEWS_API_KEY, AI_API_KEY) are stored
#     ONLY via Cloudflare Worker Secrets, never here. See README §10.
#   • `wrangler.toml` is safe to commit because it holds configuration only.
# ============================================================================


# ----------------------------------------------------------------------------
# Identity
# ----------------------------------------------------------------------------
name = "ai-trading-assistant-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]


# ----------------------------------------------------------------------------
# Default / development environment
# ----------------------------------------------------------------------------
# These `[vars]` are plain-text, non-secret strings. They are visible in the
# Cloudflare dashboard and in this repository — treat them as public.

[vars]
ENVIRONMENT = "development"
# ALLOWED_ORIGINS is a comma-separated list. If omitted or empty,
# src/config.ts falls back to DEFAULT_ALLOWED_ORIGINS (GitHub Pages + local).
# ALLOWED_ORIGINS = "https://surajsrkoli-gif.github.io,http://localhost:8787,http://localhost:5500"


# ----------------------------------------------------------------------------
# Production environment
# ----------------------------------------------------------------------------
# Activated with:  wrangler deploy --env production
# Stricter CORS: only the deployed GitHub Pages origin is allowed.

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://surajsrkoli-gif.github.io"


# ============================================================================
# SECRETS — DO NOT COMMIT
# ----------------------------------------------------------------------------
# The following commands will be used in FUTURE phases. They store values
# encrypted inside Cloudflare, never in this file, never in the repo.
#
#   wrangler secret put MARKET_DATA_API_KEY
#   wrangler secret put NEWS_API_KEY
#   wrangler secret put AI_API_KEY
#
# Runtime access (typed in src/types.ts as optional strings):
#
#   export interface Env {
#     MARKET_DATA_API_KEY?: string;
#     NEWS_API_KEY?: string;
#     AI_API_KEY?: string;
#     ...
#   }
#
# Nothing above is created or populated in Phase 2.
# ============================================================================


# ============================================================================
# OBSERVABILITY (optional, safe to leave commented out)
# ----------------------------------------------------------------------------
# Uncomment if you want Cloudflare's built-in analytics / logpush later.
#
# [observability]
# enabled = true
# ============================================================================


# ============================================================================
# NOT USED IN PHASE 2 — intentionally absent
# ----------------------------------------------------------------------------
# • [kv_namespaces]      → Phase 4 (asset catalogue, rate limiting)
# • [[d1_databases]]     → Phase 4 (watchlist sync, journal persistence)
# • [[r2_buckets]]       → later (historical data, financial documents)
# • [[queues.producers]] → later (background analysis jobs)
# • [ai]                 → Phase 6 (Cloudflare Workers AI)
# • [durable_objects]    → later (paper-trading sessions)
# • [triggers.crons]     → later (scheduled alerts)
#
# Keeping them out of Phase 2 guarantees:
#   – zero recurring cost
#   – no accidental data store
#   – no hidden attack surface
# ============================================================================
